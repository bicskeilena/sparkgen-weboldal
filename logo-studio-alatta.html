<title>SparkGen logó, studio alatta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: contact sheet; each tile shows the mark on white (header) and on navy (footer). */
:root{--paper:#F5F7FB;--tile:#FFFFFF;--ink:#101B2E;--muted:#5A667C;--line:#D9E0EB;--studio:#7F9BFF;
  --ui:"Hanken Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--wm:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0B1320;--tile:#131E30;--ink:#E8EDF6;--muted:#9AA7BD;--line:#24334B;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0B1320;--tile:#131E30;--ink:#E8EDF6;--muted:#9AA7BD;--line:#24334B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:36px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 22px;max-width:68ch;line-height:1.5}
.controls{display:grid;gap:12px;margin-bottom:26px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl>span{font-size:.85rem;color:var(--muted);width:120px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 .88rem/1 var(--ui);padding:.6em .9em;border-radius:999px;border:1px solid var(--line);background:var(--tile);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button:focus-visible{outline:3px solid #5C7BFF;outline-offset:2px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.tile{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--tile);min-width:0}
.light,.darkband{padding:46px 26px 28px;display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;min-height:190px}
.light{background:#FFFFFF;color:#101B2E}
.darkband{background:#101B2E;color:#E8EDF6}
.meta{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;font-family:var(--mono);font-size:.74rem;color:var(--muted)}

.wm{position:relative;display:inline-grid;font-family:var(--wm);line-height:1;font-size:46px;white-space:nowrap;isolation:isolate}
.wm.s{font-size:19px}
.wm .l1{font-weight:800;letter-spacing:-.045em;position:relative;z-index:1}
.wm .l2{font-weight:500;letter-spacing:-.025em;color:var(--studio);position:relative;z-index:1}
.wm.inline{display:inline-flex;align-items:baseline}
.wm svg.mk{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;z-index:2}
.wm.behind svg.mk{z-index:0}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9C7FF"/><stop offset=".55" stop-color="#7F9BFF"/><stop offset="1" stop-color="#4F6CF0"/></linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBDF5A"/><stop offset=".55" stop-color="#E9AE35"/><stop offset="1" stop-color="#C97A22"/></linearGradient>
  </defs>
</svg>

<div class="wrap">
  <h1>SparkGen logó, színváltozatok</h1>
  <p class="sub">Nagy méretben a kisebb csillag, kis méretben (fejléc, lábléc) az eredeti 2-es csillag. A csillag kék átmenettel. Négy színezés: egyszínű, illetve különböző színű „spark” és „gen”. A „studio” mindenhol #7F9BFF.</p>

  <div class="controls">
    <div class="ctl"><span>Csillag színe</span><div class="seg" id="seg-star">
      <button type="button" data-v="blue" aria-pressed="true"><i class="sw" style="background:linear-gradient(135deg,#B9C7FF,#4F6CF0)"></i>Kék átmenet</button>
      <button type="button" data-v="flat"><i class="sw" style="background:#7F9BFF"></i>Világoskék, sima</button>
      <button type="button" data-v="gold"><i class="sw" style="background:linear-gradient(135deg,#FBDF5A,#C97A22)"></i>Arany</button>
    </div></div>
    <div class="ctl"><span>„studio” színe</span><div class="seg" id="seg-studio">
      <button type="button" data-v="#7F9BFF" aria-pressed="true"><i class="sw" style="background:#7F9BFF"></i>Világos (mint a láblécben)</button>
      <button type="button" data-v="#5C7BFF"><i class="sw" style="background:#5C7BFF"></i>Kicsit mélyebb</button>
    </div></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
// sparkle: 4-point star with concave curved sides; h = half height, w = half width
function sp(cx,cy,h,w,kk){
  var k=Math.min(h,w)*(kk||0.14);
  return '<path d="M'+cx+','+(cy-h)+' Q'+(cx+k)+','+(cy-k)+' '+(cx+w)+','+cy+' Q'+(cx+k)+','+(cy+k)+' '+cx+','+(cy+h)+' Q'+(cx-k)+','+(cy+k)+' '+(cx-w)+','+cy+' Q'+(cx-k)+','+(cy-k)+' '+cx+','+(cy-h)+'Z"/>';
}
// clusters, in em*100 units; origin = top-right corner of the n (x-height line, n's right ink edge)
var C={
  final:function(){return sp(15,-19,23.5,15.5)+sp(36,-42,12,8.5)+sp(42,-16,9.5,6.5)},
  thin1:function(){return sp(16,-22,31,15,.1)+sp(38,-44,12,6.5,.1)+sp(44,-18,9.5,5,.1)},
  thin2:function(){return sp(16,-23,33,12,.07)+sp(38,-45,12.5,5.2,.07)+sp(44,-18,10,4.2,.07)},
  thin3:function(){return sp(16,-24,35,10,.05)+sp(37,-46,13,4.2,.05)+sp(43,-18,10.5,3.4,.05)},
  trio:function(){return sp(16,-22,30,20)+sp(38,-44,12,8.5)+sp(44,-18,9.5,6.5)},
  trioSmall:function(){return sp(12,-16,20,13.5)+sp(27,-31,8,5.5)+sp(31,-12,6.5,4.5)},
  behind:function(){return sp(-6,-12,40,27)+sp(24,-42,12,8.5)+sp(30,-14,9,6.2)},
  single:function(){return sp(14,-20,28,19)}
};
var V=[
 {n:"Egyszínű sparkgen",d:"a mostani",c1:"inherit",c2:"inherit"},
 {n:"gen világoskék",d:"gen = studio színe, #7F9BFF",c1:"inherit",c2:"#7F9BFF"},
 {n:"spark világoskék",d:"spark = studio színe, #7F9BFF",c1:"#7F9BFF",c2:"inherit"},
 {n:"gen mélyebb kék",d:"gen #4F6CF0, studio #7F9BFF",c1:"inherit",c2:"#4F6CF0"}
].map(function(v){v.lay="stack";v.l2=.8;v.al="left";return v});
var state={star:"gold",studio:"#7F9BFF"};


function wm(v,small){
  var cls='wm'+(small?' s':'')+(v.lay==='inline'?' inline':'')+(v.behind?' behind':'');
  var l2s=v.lay==='stack'?'font-size:'+v.l2+'em;margin-top:'+(v.l2<1?'.06em':'0')+';justify-self:'+(v.al==='right'?'end':'start')+';':'';
  return '<span class="'+cls+'"><span class="l1"><span class="p1" style="color:'+v.c1+'">spark</span><span class="p2" style="color:'+v.c2+'">gen</span></span><span class="l2" style="'+l2s+'">studio</span><svg class="mk" aria-hidden="true"></svg></span>';
}
function render(){
  document.documentElement.style.setProperty('--studio',state.studio);
  document.getElementById('grid').innerHTML=V.map(function(v,i){
    return '<div class="tile" data-i="'+i+'"><div class="light">'+wm(v)+wm(v,1)+'</div><div class="darkband">'+wm(v)+wm(v,1)+'</div>'+
      '<div class="meta"><span>'+(i+1)+'. '+v.n+'</span><span>'+v.d+'</span></div></div>';
  }).join('');
  ['star','studio'].forEach(function(k){document.querySelectorAll('#seg-'+k+' button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===state[k]))})});
  try{localStorage.setItem('sg-stack',JSON.stringify(state))}catch(e){}
  place();
}
function place(){
  var cv=document.createElement('canvas').getContext('2d');
  var fill=state.star==='gold'?'url(#g-gold)':state.star==='flat'?'#7F9BFF':'url(#g-blue)';
  document.querySelectorAll('.tile').forEach(function(t){
    var v=V[+t.dataset.i];
    t.querySelectorAll('.wm').forEach(function(w){
      var l1=w.querySelector('.l1'), F=parseFloat(getComputedStyle(l1).fontSize), txt=l1.querySelector('.p2').firstChild;
      cv.font='800 '+F+'px "Bricolage Grotesque"';
      var mn=cv.measureText('n'), mx=cv.measureText('x');
      var asc=mn.fontBoundingBoxAscent||F*.9, desc=mn.fontBoundingBoxDescent||F*.25;
      var r=document.createRange(); r.setStart(txt,2); r.setEnd(txt,3);
      var nr=r.getBoundingClientRect(), wr=w.getBoundingClientRect(), lr=l1.getBoundingClientRect();
      var baseline=(lr.top-wr.top)+(F-(asc+desc))/2+asc;
      var x=(nr.left-wr.left)+mn.actualBoundingBoxRight, y=baseline-(mx.actualBoundingBoxAscent||F*.52);
      var svg=w.querySelector('svg.mk');
      svg.style.left=x+'px'; svg.style.top=y+'px';
      svg.innerHTML='<g fill="'+fill+'" transform="scale('+(F/80)+')">'+C[w.classList.contains('s')?'trio':'final']()+'</g>';
    });
  });
}
['star','studio'].forEach(function(k){
  document.getElementById('seg-'+k).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state[k]=b.dataset.v;render()});
});
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);
</script>
