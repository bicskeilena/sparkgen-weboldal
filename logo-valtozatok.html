<title>SparkGen logóváltozatok</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Instrument+Serif:ital@0;1&family=Gloock&family=Young+Serif&family=Syne:wght@500;800&family=Unbounded:wght@400;700&family=Familjen+Grotesk:wght@400;700&family=Sora:wght@300;700&family=Hanken+Grotesk:wght@400;800&family=Schibsted+Grotesk:wght@400;800&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a contact sheet. Controls on top, then a grid of identical tiles, one per typeface. */
:root{
  --paper:#F5F7FB; --tile:#FFFFFF; --ink:#101B2E; --muted:#5A667C; --line:#D9E0EB; --blue:#2447F5; --blue-soft:#E4EAFF;
  --ui:"Hanken Grotesk",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0B1320;--tile:#131E30;--ink:#E8EDF6;--muted:#9AA7BD;--line:#24334B;--blue:#5C7BFF;--blue-soft:#17244A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0B1320;--tile:#131E30;--ink:#E8EDF6;--muted:#9AA7BD;--line:#24334B;--blue:#5C7BFF;--blue-soft:#17244A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:36px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 26px;max-width:62ch;line-height:1.5}
.controls{display:grid;gap:14px;margin-bottom:28px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl>span{font-size:.85rem;color:var(--muted);width:110px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 .88rem/1 var(--ui);padding:.6em .9em;border-radius:999px;border:1px solid var(--line);background:var(--tile);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:22px 22px 16px;display:grid;gap:18px;min-width:0}
.tile.dark{background:#101B2E;border-color:#101B2E;color:#E8EDF6}
.tile.dark .meta{color:#9AA7BD}
.stage{min-height:92px;display:flex;align-items:center;overflow:hidden}
.meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.74rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.tile.dark .meta{border-color:#26344C}
.small-row{display:flex;align-items:center;gap:14px}
.small-row .wm{font-size:18px}

/* wordmark */
.wm{position:relative;display:inline-flex;align-items:baseline;white-space:nowrap;font-size:40px;line-height:1;color:inherit}
.wm .a{font-weight:var(--w1)}
.wm .b{font-weight:var(--w2);color:var(--blue)}
.tile.dark .wm .b{color:#7F9BFF}
.wm.sp .b{margin-left:.22em}
.wm.stack{flex-direction:column;align-items:flex-start}
.wm.stack .b{font-size:.32em;letter-spacing:.42em;text-transform:uppercase;margin-top:.45em;font-family:var(--mono);font-weight:400}
/* marks */
.mk{display:none}
.m-dot .mk.dot{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--blue);margin-left:.05em;align-self:baseline}
.tile.dark .m-dot .mk.dot{background:#7F9BFF}
.m-glint .mk.glint,.m-star .mk.star{display:block;position:absolute;top:-.3em;width:.42em;height:.42em;color:var(--blue)}
.tile.dark .m-glint .mk.glint,.tile.dark .m-star .mk.star{color:#7F9BFF}
.m-glint .mk.glint{left:var(--kx)}
.m-star .mk.star{left:var(--kx)}
.wm.stack .mk.dot{display:none!important}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="glint" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v5"/><path d="M19 7l-3.2 3.2"/><path d="M21 15h-5"/></g></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 2c.6 5.6 4.4 9.4 10 10-5.6.6-9.4 4.4-10 10-.6-5.6-4.4-9.4-10-10 5.6-.6 9.4-4.4 10-10z" fill="currentColor"/></symbol>
</svg>

<div class="wrap">
  <h1>SparkGen logóváltozatok</h1>
  <p class="sub">Tizenkét betűtípus egymás mellett. Fent átállíthatod az írásmódot és a jelet, a csempék pedig azonnal frissülnek. Minden csempe alján ott a kis méretű (fejléc) változat is. Mondd meg a számát annak, ami tetszik.</p>

  <div class="controls">
    <div class="ctl"><span>Írásmód</span><div class="seg" id="seg-case">
      <button type="button" data-v="lower" aria-pressed="true">sparkgenstudio</button>
      <button type="button" data-v="space">sparkgen studio</button>
      <button type="button" data-v="title">SparkGen Studio</button>
      <button type="button" data-v="stack">sparkgen / STUDIO alatta</button>
    </div></div>
    <div class="ctl"><span>Jel</span><div class="seg" id="seg-mark">
      <button type="button" data-v="none" aria-pressed="true">Nincs</button>
      <button type="button" data-v="dot">Kék pont</button>
      <button type="button" data-v="glint">Szikra (3 vonal)</button>
      <button type="button" data-v="star">Kis csillag, éles</button>
    </div></div>
    <div class="ctl"><span>Háttér</span><div class="seg" id="seg-bg">
      <button type="button" data-v="light" aria-pressed="true">Világos</button>
      <button type="button" data-v="dark">Sötét</button>
    </div></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
var FONTS=[
 {n:"Bricolage Grotesque",f:"'Bricolage Grotesque'",w1:800,w2:500,ls:"-.045em",note:"a mostani"},
 {n:"Fraunces",f:"'Fraunces'",w1:700,w2:400,ls:"-.03em",note:"lágy, meleg serif"},
 {n:"Instrument Serif",f:"'Instrument Serif'",w1:400,w2:400,ls:"-.01em",note:"elegáns, vékony",it2:true},
 {n:"Gloock",f:"'Gloock'",w1:400,w2:400,ls:"-.02em",note:"kontrasztos, magazinos"},
 {n:"Young Serif",f:"'Young Serif'",w1:400,w2:400,ls:"-.03em",note:"barátságos, kerek serif"},
 {n:"Newsreader",f:"'Newsreader'",w1:600,w2:400,ls:"-.02em",note:"klasszikus, levélszerű"},
 {n:"Syne",f:"'Syne'",w1:800,w2:500,ls:"-.03em",note:"széles, karakteres"},
 {n:"Unbounded",f:"'Unbounded'",w1:700,w2:400,ls:"-.04em",note:"kerek, modern"},
 {n:"Familjen Grotesk",f:"'Familjen Grotesk'",w1:700,w2:400,ls:"-.03em",note:"tiszta, picit egyedi"},
 {n:"Sora",f:"'Sora'",w1:700,w2:300,ls:"-.04em",note:"geometrikus, tech"},
 {n:"Hanken Grotesk",f:"'Hanken Grotesk'",w1:800,w2:400,ls:"-.04em",note:"semleges, erős"},
 {n:"Schibsted Grotesk",f:"'Schibsted Grotesk'",w1:800,w2:400,ls:"-.035em",note:"szerkesztőségi grotesk"}
];
var state={case:"lower",mark:"none",bg:"light"};
try{var s=JSON.parse(localStorage.getItem('sg-logo')||'null');if(s)state=Object.assign(state,s)}catch(e){}

function wm(font){
  var a="sparkgen",b="studio",cls="wm";
  if(state.case==="title"){a="SparkGen";b="Studio";cls+=" sp"}
  if(state.case==="space")cls+=" sp";
  if(state.case==="stack")cls+=" stack";
  cls+=" m-"+state.mark;
  var it=font.it2?"font-style:italic;":"";
  return '<span class="'+cls+'" style="font-family:'+font.f+',serif;letter-spacing:'+font.ls+';--w1:'+font.w1+';--w2:'+font.w2+'">'+
    '<span class="a">'+a+'<i class="mk dot"></i></span>'+
    '<span class="b" style="'+it+'">'+b+'</span>'+
    '<svg class="mk glint"><use href="#glint"/></svg><svg class="mk star"><use href="#star"/></svg></span>';
}
function render(){
  var g=document.getElementById('grid');
  g.innerHTML=FONTS.map(function(f,i){
    return '<div class="tile'+(state.bg==="dark"?" dark":"")+'"><div class="stage">'+wm(f)+'</div>'+
      '<div class="small-row">'+wm(f)+'</div>'+
      '<div class="meta"><span>'+(i+1)+'. '+f.n+'</span><span>'+f.note+'</span></div></div>';
  }).join('');
  // place glint/star over the end of "spark": measure the "a" span text width ratio
  document.querySelectorAll('.wm').forEach(function(w){
    var a=w.querySelector('.a'); if(!a)return;
    var r=document.createRange(); var t=a.firstChild; if(!t||t.nodeType!==3)return;
    r.setStart(t,0); r.setEnd(t,5); var rect=r.getBoundingClientRect(), wr=w.getBoundingClientRect();
    var fs=parseFloat(getComputedStyle(w).fontSize)||40;
    w.style.setProperty('--kx',(rect.right-wr.left-fs*0.12)+'px');
  });
  ['case','mark','bg'].forEach(function(k){
    document.querySelectorAll('#seg-'+k+' button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===state[k]))});
  });
  try{localStorage.setItem('sg-logo',JSON.stringify(state))}catch(e){}
}
['case','mark','bg'].forEach(function(k){
  document.getElementById('seg-'+k).addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return; state[k]=b.dataset.v; render();
  });
});
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
</script>
